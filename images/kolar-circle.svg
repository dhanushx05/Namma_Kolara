<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="28%" stop-color="#ffc93c"/>
      <stop offset="55%" stop-color="#ff7a1a"/>
      <stop offset="78%" stop-color="#b31670"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b31670" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="silhouette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1030"/>
      <stop offset="100%" stop-color="#1c0a18"/>
    </linearGradient>
  </defs>

  <!-- base sky -->
  <rect x="0" y="0" width="800" height="800" fill="url(#sunGlow)"/>

  <!-- faint brand-ring arcs echoing the logo motif -->
  <g stroke="#ffffff" stroke-opacity="0.25" fill="none" stroke-width="2">
    <circle cx="400" cy="300" r="230"/>
    <circle cx="400" cy="300" r="310"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.4" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M 190 480 A 230 230 0 0 1 250 100"/>
    <path d="M 610 480 A 230 230 0 0 0 550 100"/>
  </g>

  <!-- sun disc -->
  <circle cx="400" cy="290" r="112" fill="#fff6df" fill-opacity="0.9"/>
  <circle cx="400" cy="290" r="112" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>

  <!-- birds -->
  <g stroke="#3a1030" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M300 170 q14 -16 28 0 q14 -16 28 0"/>
    <path d="M480 210 q10 -12 20 0 q10 -12 20 0"/>
  </g>

  <!-- distant hills (left) -->
  <path d="M0 560 L60 470 L130 545 L210 440 L300 560 Z" fill="url(#silhouette)" opacity="0.9"/>

  <!-- small hill shrine dome -->
  <g fill="url(#silhouette)">
    <circle cx="150" cy="472" r="14"/>
    <rect x="140" y="472" width="20" height="18"/>
  </g>

  <!-- temple gopuram (stepped tower), right of center -->
  <g fill="url(#silhouette)">
    <rect x="470" y="530" width="130" height="90"/>
    <polygon points="470,530 600,530 588,494 482,494"/>
    <polygon points="482,494 588,494 578,462 492,462"/>
    <polygon points="492,462 578,462 568,432 502,432"/>
    <polygon points="502,432 568,432 558,404 512,404"/>
    <polygon points="512,404 558,404 535,368 535,368"/>
    <circle cx="535" cy="358" r="8"/>
  </g>

  <!-- foreground rooftops -->
  <g fill="url(#silhouette)">
    <rect x="230" y="565" width="90" height="55"/>
    <polygon points="222,565 328,565 275,538"/>
    <rect x="330" y="580" width="60" height="40"/>
    <polygon points="325,580 395,580 360,560"/>
  </g>

  <!-- tree line -->
  <g fill="url(#silhouette)" opacity="0.95">
    <ellipse cx="400" cy="600" rx="26" ry="34"/>
    <ellipse cx="430" cy="610" rx="20" ry="26"/>
    <ellipse cx="640" cy="600" rx="24" ry="30"/>
    <ellipse cx="665" cy="612" rx="18" ry="24"/>
  </g>

  <!-- water band + reflection -->
  <rect x="0" y="620" width="800" height="180" fill="url(#waterGrad)"/>
  <g fill="url(#silhouette)" opacity="0.35" transform="translate(0,1250) scale(1,-1)">
    <polygon points="470,530 600,530 588,494 482,494"/>
    <polygon points="482,494 588,494 578,462 492,462"/>
    <rect x="470" y="530" width="130" height="90"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="3">
    <line x1="60" y1="700" x2="200" y2="700"/>
    <line x1="500" y1="730" x2="700" y2="730"/>
    <line x1="150" y1="760" x2="350" y2="760"/>
  </g>
</svg>
